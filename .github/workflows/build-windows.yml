name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - ddevloper738-modernize-quicklaunch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release executable
        run: msbuild QuickLaunch\QuickLaunch.csproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item QuickLaunch\bin\Release\QuickLaunch.exe artifact\
          Copy-Item QuickLaunch\bin\Release\QuickLaunch.exe.config artifact\

      - name: Upload QuickLaunch executable
        uses: actions/upload-artifact@v4
        with:
          name: QuickLaunch-windows
          path: artifact
          if-no-files-found: error
